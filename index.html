<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>圈人工作台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap">
<style>
:root{
  --paper:#F3F4F9; --surface:#FFFFFF; --surface-2:#EAEBF3; --surface-3:#E1E2EE;
  --ink:#1C1D2E; --ink-2:#4B4C68; --ink-3:#84859E;
  --rule:#DBDCE7; --rule-soft:#E9E9F2;
  --agent:#5136D9; --agent-soft:#EBE6FB;
  --gov:#93610C; --gov-soft:#F6E9D2;
  --risk:#AE3430; --risk-soft:#F8E2E0;
  --ok:#1D6B4F; --ok-soft:#DDF0E7;
  --shadow:0 1px 2px rgba(28,29,46,.05), 0 8px 22px -16px rgba(28,29,46,.3);
  --fd:"Manrope","Noto Sans SC",system-ui,sans-serif;
  --fb:"Noto Sans SC",system-ui,-apple-system,sans-serif;
  --fm:"JetBrains Mono","Noto Sans SC",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#131320; --surface:#1B1C2C; --surface-2:#232437; --surface-3:#2B2C42;
  --ink:#E7E7F2; --ink-2:#ABACC4; --ink-3:#797A96;
  --rule:#31324A; --rule-soft:#26273B;
  --agent:#9B87F5; --agent-soft:#2A2350;
  --gov:#E0AC55; --gov-soft:#3A2E14;
  --risk:#E6928D; --risk-soft:#3B2019;
  --ok:#5CBF95; --ok-soft:#14311F;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 22px -16px rgba(0,0,0,.85);}}
:root[data-theme="dark"]{
  --paper:#131320; --surface:#1B1C2C; --surface-2:#232437; --surface-3:#2B2C42;
  --ink:#E7E7F2; --ink-2:#ABACC4; --ink-3:#797A96;
  --rule:#31324A; --rule-soft:#26273B;
  --agent:#9B87F5; --agent-soft:#2A2350;
  --gov:#E0AC55; --gov-soft:#3A2E14;
  --risk:#E6928D; --risk-soft:#3B2019;
  --ok:#5CBF95; --ok-soft:#14311F;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 22px -16px rgba(0,0,0,.85);}
*{box-sizing:border-box;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--fb);
  font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,select{font-family:inherit;font-size:inherit;color:inherit;}
.mono{font-family:var(--fm);font-variant-numeric:tabular-nums;}
:focus-visible{outline:2px solid var(--agent);outline-offset:2px;}

/* ---------- app frame ---------- */
.app{max-width:1500px;margin:0 auto;padding:0 clamp(.5rem,1.6vw,1rem) 2rem;}
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem .9rem;
  padding:.75rem .25rem .8rem;border-bottom:1px solid var(--rule);margin-bottom:.85rem;}
.brand{display:flex;align-items:baseline;gap:.55rem;}
.brand h1{margin:0;font-family:var(--fd);font-size:1.12rem;font-weight:800;letter-spacing:-.01em;}
.brand .sub{font-family:var(--fm);font-size:.66rem;color:var(--ink-3);letter-spacing:.06em;}
.spacer{flex:1 1 auto;}
.ctl{display:flex;align-items:center;gap:.4rem;}
.ctl label{font-family:var(--fm);font-size:.63rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600;}
select.role{background:var(--surface);border:1px solid var(--rule);border-radius:4px;
  padding:.32rem .5rem;font-size:.78rem;font-weight:600;}
.tbtn{background:var(--surface);border:1px solid var(--rule);border-radius:4px;
  padding:.33rem .62rem;font-size:.76rem;color:var(--ink-2);font-weight:600;}
.tbtn:hover{background:var(--surface-2);color:var(--ink);}

.banner{background:var(--agent-soft);border:1px solid var(--agent);border-radius:5px;
  padding:.6rem .8rem;margin-bottom:.85rem;font-size:.78rem;color:var(--ink-2);line-height:1.6;}
.banner b{color:var(--ink);}
.banner .bl{font-family:var(--fm);font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--agent);font-weight:700;display:block;margin-bottom:.15rem;}

/* ---------- 3 columns ---------- */
.cols{display:grid;grid-template-columns:minmax(0,1fr);gap:.7rem;align-items:start;}
@media(min-width:1080px){.cols{grid-template-columns:minmax(0,.82fr) minmax(0,1.4fr) minmax(0,.78fr);}}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:6px;
  box-shadow:var(--shadow);display:flex;flex-direction:column;min-width:0;}
.ptitle{font-family:var(--fm);font-size:.6rem;letter-spacing:.11em;text-transform:uppercase;
  font-weight:700;color:var(--ink-3);padding:.6rem .8rem .5rem;border-bottom:1px solid var(--rule-soft);
  display:flex;justify-content:space-between;align-items:center;gap:.4rem;}
.pbody{padding:.7rem .8rem .85rem;display:flex;flex-direction:column;gap:.55rem;min-width:0;}

/* ---------- chat ---------- */
.chat{display:flex;flex-direction:column;gap:.45rem;max-height:min(52vh,440px);overflow-y:auto;}
.msg{border-radius:5px;padding:.5rem .65rem;font-size:.79rem;line-height:1.6;}
.msg.u{background:var(--surface-3);color:var(--ink);align-self:flex-end;max-width:94%;}
.msg.a{background:var(--agent-soft);border-left:2px solid var(--agent);color:var(--ink-2);}
.msg .who{font-family:var(--fm);font-size:.56rem;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3);font-weight:700;display:block;margin-bottom:.15rem;}
.msg b{color:var(--ink);}
.msg.thinking{color:var(--ink-3);font-style:italic;}
.chips{display:flex;flex-wrap:wrap;gap:.3rem;}
.chip{background:var(--surface-2);border:1px solid var(--rule);border-radius:20px;
  padding:.28rem .6rem;font-size:.72rem;color:var(--ink-2);text-align:left;line-height:1.4;}
.chip:hover{background:var(--agent-soft);border-color:var(--agent);color:var(--ink);}
.inputrow{display:flex;gap:.35rem;}
.inputrow input{flex:1;background:var(--surface-2);border:1px solid var(--rule);border-radius:4px;
  padding:.42rem .55rem;font-size:.78rem;min-width:0;}
.inputrow input::placeholder{color:var(--ink-3);}
.hint{font-size:.68rem;color:var(--ink-3);line-height:1.5;}

/* ---------- canvas ---------- */
.grp{border:1px solid var(--rule);border-radius:5px;overflow:hidden;}
.grp .gh{display:flex;justify-content:space-between;align-items:center;gap:.4rem;
  padding:.38rem .6rem;background:var(--surface-2);border-bottom:1px solid var(--rule-soft);}
.grp .gh .gn{font-family:var(--fm);font-size:.6rem;letter-spacing:.08em;font-weight:700;color:var(--ink-3);}
.grp .gh .gc{font-family:var(--fm);font-size:.68rem;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;}
.grp.ex{border-color:var(--risk);}
.grp.ex .gh{background:var(--risk-soft);}
.grp.ex .gh .gn,.grp.ex .gh .gc{color:var(--risk);}

.cond{display:flex;align-items:flex-start;gap:.5rem;padding:.48rem .6rem;
  border-bottom:1px solid var(--rule-soft);}
.cond:last-child{border-bottom:none;}
.cond.pending{background:var(--gov-soft);}
.cond.denied{background:var(--risk-soft);}
.cmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:.18rem;}
.crow1{display:flex;align-items:center;gap:.35rem;flex-wrap:wrap;}
.ctype{font-family:var(--fm);font-size:.54rem;font-weight:700;padding:.09rem .3rem;
  border-radius:2px;letter-spacing:.04em;flex:none;}
.ctype.enum{background:var(--ok-soft);color:var(--ok);}
.ctype.interest{background:var(--agent-soft);color:var(--agent);}
.ctype.behavior{background:var(--gov-soft);color:var(--gov);}
.clv{font-family:var(--fm);font-size:.53rem;font-weight:700;padding:.08rem .26rem;border-radius:2px;
  border:1px solid var(--rule);color:var(--ink-3);flex:none;}
.clv.hi{border-color:var(--gov);color:var(--gov);}
.ctext{font-size:.78rem;color:var(--ink);line-height:1.45;}
.cnote{font-size:.68rem;color:var(--ink-2);line-height:1.45;}
.cnote.warn{color:var(--gov);font-weight:600;}
.cnote.bad{color:var(--risk);font-weight:600;}
.cright{display:flex;flex-direction:column;align-items:flex-end;gap:.25rem;flex:none;}
.cnum{font-family:var(--fm);font-size:.68rem;color:var(--ink-3);font-variant-numeric:tabular-nums;}
.cacts{display:flex;gap:.25rem;}
.mini{font-family:var(--fm);font-size:.58rem;font-weight:700;letter-spacing:.03em;
  padding:.16rem .38rem;border-radius:3px;border:1px solid var(--rule);color:var(--ink-3);}
.mini:hover{border-color:var(--agent);color:var(--agent);}
.mini.cta{border-color:var(--gov);color:var(--gov);background:var(--gov-soft);}
.mini.cta:hover{background:var(--gov);color:var(--surface);}
.joiner{text-align:center;font-family:var(--fm);font-size:.62rem;font-weight:700;
  color:var(--agent);letter-spacing:.14em;padding:.1rem 0;}
.addrow{display:flex;gap:.35rem;flex-wrap:wrap;}
.addbtn{background:var(--surface-2);border:1px dashed var(--rule);border-radius:4px;
  padding:.34rem .6rem;font-size:.72rem;color:var(--ink-2);font-weight:600;}
.addbtn:hover{border-color:var(--agent);color:var(--agent);background:var(--agent-soft);}
.empty{padding:1.4rem .8rem;text-align:center;color:var(--ink-3);font-size:.78rem;line-height:1.7;
  border:1px dashed var(--rule);border-radius:5px;}

/* ---------- preview ---------- */
.kpi{background:var(--surface-2);border-radius:5px;padding:.6rem .7rem;}
.kpi .kl{font-family:var(--fm);font-size:.56rem;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3);font-weight:700;}
.kpi .kv{font-family:var(--fm);font-size:1.55rem;font-weight:700;color:var(--ink);
  font-variant-numeric:tabular-nums;line-height:1.15;margin-top:.05rem;}
.kpi .kd{font-size:.68rem;color:var(--ink-2);margin-top:.15rem;line-height:1.5;}
.kpi.warn{background:var(--gov-soft);}
.kpi.warn .kl{color:var(--gov);}
.kpi.bad{background:var(--risk-soft);}
.kpi.bad .kl{color:var(--risk);}
.delta{font-family:var(--fm);font-size:.66rem;font-weight:700;}
.delta.up{color:var(--ok);} .delta.dn{color:var(--risk);}
.sect{font-family:var(--fm);font-size:.56rem;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3);font-weight:700;margin-bottom:.3rem;}
.bars{display:flex;flex-direction:column;gap:.28rem;}
.barrow{display:grid;grid-template-columns:60px 1fr 30px;align-items:center;gap:.35rem;font-size:.7rem;color:var(--ink-2);}
.bwrap{height:5px;border-radius:3px;background:var(--surface-3);overflow:hidden;}
.bfill{height:100%;background:var(--agent);border-radius:3px;transition:width .35s;}
.bn{font-family:var(--fm);font-size:.6rem;color:var(--ink-3);text-align:right;font-variant-numeric:tabular-nums;}
.bigbtn{width:100%;background:var(--agent);color:#fff;border-radius:5px;padding:.55rem;
  font-family:var(--fd);font-weight:700;font-size:.85rem;letter-spacing:.01em;}
.bigbtn:hover{filter:brightness(1.08);}
.bigbtn:disabled{background:var(--surface-3);color:var(--ink-3);cursor:not-allowed;filter:none;}
:root[data-theme="dark"] .bigbtn{color:#131320;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .bigbtn{color:#131320;}}
.ghostbtn{width:100%;background:transparent;border:1px solid var(--rule);color:var(--ink-2);
  border-radius:5px;padding:.45rem;font-size:.78rem;font-weight:600;}
.ghostbtn:hover{border-color:var(--agent);color:var(--agent);}
.blockmsg{font-size:.7rem;color:var(--gov);line-height:1.5;font-weight:600;text-align:center;}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(16,17,30,.55);display:grid;place-items:center;
  padding:1rem;z-index:50;}
.mask[hidden]{display:none!important;}
.modal{background:var(--surface);border:1px solid var(--rule);border-radius:8px;
  box-shadow:0 24px 60px -20px rgba(0,0,0,.5);width:min(760px,100%);max-height:88vh;
  display:flex;flex-direction:column;overflow:hidden;}
.mhead{padding:.8rem 1rem .7rem;border-bottom:1px solid var(--rule);display:flex;
  justify-content:space-between;align-items:baseline;gap:.6rem;}
.mhead h2{margin:0;font-family:var(--fd);font-size:1rem;font-weight:800;}
.mhead .ms{font-size:.72rem;color:var(--ink-3);}
.mbody{padding:.85rem 1rem;overflow-y:auto;display:flex;flex-direction:column;gap:.7rem;}
.mfoot{padding:.7rem 1rem;border-top:1px solid var(--rule);display:flex;gap:.5rem;
  justify-content:flex-end;align-items:center;background:var(--surface-2);flex-wrap:wrap;}
.mfoot .fnote{margin-right:auto;font-size:.7rem;color:var(--ink-3);}
.btn{border-radius:5px;padding:.42rem .85rem;font-weight:700;font-size:.8rem;}
.btn.pri{background:var(--agent);color:#fff;}
:root[data-theme="dark"] .btn.pri{color:#131320;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.pri{color:#131320;}}
.btn.pri:disabled{background:var(--surface-3);color:var(--ink-3);cursor:not-allowed;}
.btn.sec{border:1px solid var(--rule);color:var(--ink-2);}
.btn.sec:hover{border-color:var(--agent);color:var(--agent);}

.tabs{display:flex;gap:.3rem;border-bottom:1px solid var(--rule);padding-bottom:.5rem;flex-wrap:wrap;}
.tab{padding:.32rem .6rem;border-radius:4px;font-size:.76rem;font-weight:600;color:var(--ink-3);
  border:1px solid transparent;}
.tab:hover{color:var(--ink);}
.tab.on{background:var(--agent-soft);color:var(--agent);border-color:var(--agent);}
.tabnote{font-size:.7rem;color:var(--ink-2);line-height:1.55;background:var(--surface-2);
  border-radius:4px;padding:.5rem .6rem;}
.tabnote b{color:var(--ink);}

.srch{width:100%;background:var(--surface-2);border:1px solid var(--rule);border-radius:4px;
  padding:.45rem .6rem;font-size:.82rem;}
.optlist{display:flex;flex-direction:column;gap:.3rem;max-height:300px;overflow-y:auto;}
.opt{display:flex;align-items:flex-start;gap:.55rem;border:1px solid var(--rule);border-radius:5px;
  padding:.5rem .6rem;background:var(--surface);text-align:left;width:100%;}
.opt:hover{border-color:var(--agent);background:var(--agent-soft);}
.opt.on{border-color:var(--agent);background:var(--agent-soft);}
.opt.locked{opacity:.55;cursor:not-allowed;}
.opt.locked:hover{border-color:var(--rule);background:var(--surface);}
.opt .ck{width:15px;height:15px;border:1.5px solid var(--rule);border-radius:3px;flex:none;margin-top:.15rem;
  display:grid;place-items:center;font-size:.6rem;color:#fff;}
.opt.on .ck{background:var(--agent);border-color:var(--agent);}
:root[data-theme="dark"] .opt.on .ck{color:#131320;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .opt.on .ck{color:#131320;}}
.opt .ob{flex:1;min-width:0;}
.opt .on1{display:flex;align-items:center;gap:.35rem;flex-wrap:wrap;}
.opt .onm{font-size:.82rem;font-weight:600;color:var(--ink);}
.opt .od{font-size:.68rem;color:var(--ink-2);margin-top:.15rem;line-height:1.5;}
.opt .om{font-family:var(--fm);font-size:.62rem;color:var(--ink-3);margin-top:.2rem;
  display:flex;gap:.6rem;flex-wrap:wrap;}
.opt .cnt{font-family:var(--fm);font-size:.72rem;font-weight:700;color:var(--ink-2);flex:none;
  font-variant-numeric:tabular-nums;}
.valbar{height:4px;border-radius:2px;background:var(--surface-3);margin-top:.25rem;overflow:hidden;}
.valbar i{display:block;height:100%;background:var(--ok);border-radius:2px;}

.builder{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;background:var(--surface-2);
  border-radius:5px;padding:.6rem .7rem;}
.builder select,.builder input{background:var(--surface);border:1px solid var(--rule);
  border-radius:4px;padding:.32rem .45rem;font-size:.78rem;}
.builder .lbl{font-size:.75rem;color:var(--ink-2);}
.tplrow{display:flex;flex-wrap:wrap;gap:.3rem;}

.recap{background:var(--surface-2);border-left:3px solid var(--agent);border-radius:0 5px 5px 0;
  padding:.7rem .85rem;font-size:.85rem;line-height:1.75;color:var(--ink);}
.recap .rl{font-family:var(--fm);font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--agent);font-weight:700;margin-bottom:.25rem;}
.recap em{font-style:normal;color:var(--agent);font-weight:700;}
.warnbox{background:var(--gov-soft);border-left:3px solid var(--gov);border-radius:0 5px 5px 0;
  padding:.6rem .8rem;font-size:.74rem;color:var(--ink-2);line-height:1.6;}
.warnbox b{color:var(--ink);}
.warnbox .wl{font-family:var(--fm);font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--gov);font-weight:700;margin-bottom:.2rem;}

/* result */
.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.5rem;}
.rcard{background:var(--surface-2);border-radius:5px;padding:.6rem .7rem;}
.rcard .rl{font-family:var(--fm);font-size:.56rem;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3);font-weight:700;}
.rcard .rv{font-family:var(--fm);font-size:1.15rem;font-weight:700;color:var(--ink);margin-top:.05rem;
  font-variant-numeric:tabular-nums;}
.rcard .rd{font-size:.66rem;color:var(--ink-2);margin-top:.1rem;line-height:1.45;}
.dispatch{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.4rem;}
.dbtn{border:1px solid var(--rule);border-radius:5px;padding:.55rem .65rem;text-align:left;background:var(--surface);}
.dbtn:hover{border-color:var(--agent);background:var(--agent-soft);}
.dbtn.on{border-color:var(--agent);background:var(--agent-soft);}
.dbtn .dn{font-size:.8rem;font-weight:700;color:var(--ink);}
.dbtn .dd{font-size:.66rem;color:var(--ink-2);margin-top:.12rem;line-height:1.45;}
.saveopt{display:flex;gap:.4rem;flex-wrap:wrap;}
.sopt{border:1px solid var(--rule);border-radius:5px;padding:.5rem .6rem;flex:1 1 180px;text-align:left;background:var(--surface);}
.sopt:hover{border-color:var(--agent);}
.sopt.on{border-color:var(--agent);background:var(--agent-soft);}
.sopt .sn{font-size:.78rem;font-weight:700;color:var(--ink);}
.sopt .sd{font-size:.66rem;color:var(--ink-2);margin-top:.1rem;line-height:1.45;}
.contract{background:var(--ok-soft);border-left:3px solid var(--ok);border-radius:0 5px 5px 0;
  padding:.6rem .8rem;font-size:.74rem;color:var(--ink-2);line-height:1.6;}
.contract .cl2{font-family:var(--fm);font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ok);font-weight:700;margin-bottom:.2rem;}
.contract b{color:var(--ink);}
code{font-family:var(--fm);font-size:.92em;background:var(--surface-2);padding:.05rem .28rem;border-radius:2px;}

/* ---------- view tabs ---------- */
.vtabs{display:flex;gap:.3rem;margin-bottom:.85rem;flex-wrap:wrap;}
.vtab{padding:.4rem .85rem;border-radius:5px;font-size:.82rem;font-weight:700;color:var(--ink-3);
  border:1px solid transparent;font-family:var(--fd);}
.vtab:hover{color:var(--ink);}
.vtab.on{background:var(--surface);color:var(--agent);border-color:var(--rule);box-shadow:var(--shadow);}
.vtab .cnt2{font-family:var(--fm);font-size:.62rem;background:var(--agent);color:#fff;
  border-radius:9px;padding:.03rem .32rem;margin-left:.3rem;}
:root[data-theme="dark"] .vtab .cnt2{color:#131320;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .vtab .cnt2{color:#131320;}}
.vtab .cnt2.alert{background:var(--risk);}

/* ---------- assets ---------- */
.assets{display:grid;grid-template-columns:minmax(0,1fr);gap:.7rem;align-items:start;}
@media(min-width:1000px){.assets{grid-template-columns:minmax(0,.6fr) minmax(0,1fr);}}
.filters{display:flex;gap:.25rem;flex-wrap:wrap;margin-bottom:.5rem;}
.fbtn{border:1px solid var(--rule);border-radius:20px;padding:.2rem .6rem;font-size:.72rem;
  color:var(--ink-3);font-weight:600;}
.fbtn.on{background:var(--agent-soft);border-color:var(--agent);color:var(--agent);}
.alist{display:flex;flex-direction:column;gap:.4rem;}
.arow{border:1px solid var(--rule);border-radius:5px;padding:.55rem .7rem;background:var(--surface);
  text-align:left;width:100%;display:flex;flex-direction:column;gap:.25rem;}
.arow:hover{border-color:var(--agent);}
.arow.on{border-color:var(--agent);background:var(--agent-soft);}
.arow .a1{display:flex;align-items:center;gap:.35rem;flex-wrap:wrap;}
.arow .anm{font-size:.8rem;font-weight:700;color:var(--ink);flex:1 1 auto;min-width:0;line-height:1.4;}
.kind{font-family:var(--fm);font-size:.54rem;font-weight:700;padding:.09rem .32rem;border-radius:2px;flex:none;}

var S, uid = 0, lastReach = null;
function nid(){ return 'x' + (++uid); }
function fresh(){
  return { role:(S&&S.role)||'ops', groups:[{ id:nid(), conds:[] }], excludes:[], msgs:[], view:'build' };
}
S = fresh();

/* ============ 计算 ============ */
function condRatio(c){ return c.reach / TOTAL; }
function groupRatio(conds){
  var act = conds.filter(function(c){ return c.confirmed && canSee(c.lv); });
  if(!act.length) return 0;
  var rs = act.map(condRatio).sort(function(a,b){ return a-b; });
  var r = rs[0];
  for(var i=1;i<rs.length;i++) r *= Math.pow(rs[i], 0.15);
  return r;
}
function orRatio(list){
  var p = 1;
  for(var i=0;i<list.length;i++) p *= (1 - list[i]);
  return 1 - p;
}
function compute(){
  var gr = S.groups.map(function(g){ return groupRatio(g.conds); });
  var base = orRatio(gr.filter(function(x){ return x>0; }));
  var exActive = S.excludes.filter(function(c){ return c.confirmed && canSee(c.lv); });
  var exR = orRatio(exActive.map(condRatio));
  var cut = Math.min(0.68, exR * 11);
  var finalR = base * (1 - cut);
  return { groupRatios:gr, base:base, cut:cut, ratio:finalR, reach:Math.round(finalR * TOTAL) };
}
function allConds(){
  var a = [];
  S.groups.forEach(function(g){ a = a.concat(g.conds); });
  return a.concat(S.excludes);
}
function pending(){ return allConds().filter(function(c){ return !c.confirmed; }); }
function denied(){ return allConds().filter(function(c){ return !canSee(c.lv); }); }
function crossDomain(){
  var ns = {};
  allConds().forEach(function(c){ if(canSee(c.lv)) ns[c.ns] = 1; });
  if(ns.cross) return true;
  return !!(ns.local && ns.ecom) || !!(ns.ad && (ns.local||ns.ecom));
}
function tgi(){
  var act = allConds().filter(function(c){ return c.confirmed && canSee(c.lv) && PROFILES[c.src]; });
  var out = {};
  DIMS.forEach(function(d){
    if(!act.length){ out[d] = 100; return; }
    var s = 0;
    act.forEach(function(c){ s += (PROFILES[c.src][d] || 100); });
    out[d] = Math.round(s / act.length);
  });
  return out;
}
function overlapPct(seed){
  var h = 0, str = allConds().map(function(c){ return c.src; }).join('|') + seed;
  for(var i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i)) >>> 0; }
  return 4 + (h % 46);
}
function fmt(n){
  if(n >= 100000000) return (n/100000000).toFixed(2).replace(/\.?0+$/,'') + '亿';
  if(n >= 10000) return (n/10000).toFixed(n>=1000000?0:1).replace(/\.0$/,'') + '万';
  return String(n);
}
function esc(s){ return String(s).replace(/[&<>"]/g, function(m){
  return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[m]; }); }

/* ============ 条件构造 ============ */
function mkEnum(tag, vals){
  var reach = 0;
  tag.vals.forEach(function(v){ if(vals.indexOf(v[0])>-1) reach += v[1]; });
  return { id:nid(), type:'enum', src:tag.id, name:tag.name, ns:tag.ns, lv:tag.lv,
    text:tag.name + ' ∈ {' + vals.join(', ') + '}', reach:reach, confirmed:true,
    note:tag.caveat || '', vals:vals };
}
function mkInterest(cands, chosen){
  var reach = 0, names = [];
  chosen.forEach(function(id){
    var t = INTERESTS.filter(function(x){ return x.id===id; })[0];
    if(t){ reach += t.reach; names.push(t.name); }
  });
  reach = Math.round(reach * (chosen.length>1 ? 0.82 : 1));
  var top = INTERESTS.filter(function(x){ return x.id === chosen[0]; })[0] ||
            INTERESTS.filter(function(x){ return x.id === cands[0]; })[0];
  return { id:nid(), type:'interest', src:top.id, name:top.name, ns:top.ns, lv:top.lv,
    text: names.length ? names.join(' 或 ') : '（' + cands.length + ' 个候选待确认）',
    reach:reach, confirmed:chosen.length>0, cands:cands, chosen:chosen, note:'' };
}
function mkBehavior(evId, w, t, mod, neg){
  var ev = EVENTS.filter(function(x){ return x.id===evId; })[0];
  var wf = 1, tf = 1, mf = 1;
  WINDOWS.forEach(function(x){ if(x[0]===w) wf = x[1]; });
  THRESH.forEach(function(x){ if(x[0]===t) tf = x[1]; });
  MODS.forEach(function(x){ if(x[0]===mod) mf = x[2]; });
  var reach = Math.round(TOTAL * ev.base * wf * tf * mf);
  if(neg) reach = Math.round(TOTAL * 0.42);
  var modTxt = '';
  MODS.forEach(function(x){ if(x[0]===mod && x[0]!=='none') modTxt = ' ' + x[1]; });
  return { id:nid(), type:'behavior', src:ev.id, name:ev.name, ns:ev.ns, lv:ev.lv,
    text:(neg?'未发生 · ':'') + '近 ' + w + ' 天 ' + ev.name + (neg?'':' ≥ ' + t + ' 次') + modTxt,
    reach:reach, confirmed:true, note:'', ev:evId, w:w, t:t, mod:mod, neg:!!neg };
}

         '<button class="addbtn" data-add="' + g.id + '">+ 加条件</button>' +
         (S.groups.length>1 ? ' <button class="addbtn" data-delgrp="' + g.id + '">删除本组</button>' : '') +
         '</div></div>';
  });
  h += '<div class="addrow"><button class="addbtn" id="addgrp">+ 加条件组（OR）</button></div>';

  h += '<div class="grp ex" style="margin-top:.2rem"><div class="gh"><span class="gn">排除区 · NOT</span>' +
       '<span class="gc">' + (r.cut>0 ? '−' + Math.round(r.cut*100) + '%' : '—') + '</span></div>';
  if(!S.excludes.length){
    h += '<div style="padding:.55rem;font-size:.72rem;color:var(--ink-3);text-align:center">未设置排除条件</div>';
  } else {
    S.excludes.forEach(function(c){ h += condHTML(c, 'x'); });
  }
  h += '<div style="padding:.4rem .6rem;border-top:1px solid var(--rule-soft)">' +
       '<button class="addbtn" data-add="EX">+ 加排除条件</button></div></div>';

  if(!allConds().length){
    h = '<div class="empty">还没有条件。<br>点左边的示例问句，或直接「+ 加条件」。</div>' + h;
  }
  elCanvas.innerHTML = h;
}

function renderPreview(){
  var r = compute(), pend = pending(), den = denied(), t = tgi();
  var h = '';
  var delta = (lastReach !== null && lastReach !== r.reach)
    ? '<span class="delta ' + (r.reach>lastReach?'up':'dn') + '">' +
      (r.reach>lastReach?'+':'−') + fmt(Math.abs(r.reach-lastReach)) + '</span>' : '';
  h += '<div class="kpi"><div class="kl">预估规模</div>' +
       '<div class="kv" id="bignum">' + fmt(r.reach) + '</div>' +
       '<div class="kd">占大盘 ' + (r.ratio*100).toFixed(2) + '% ' + delta + '</div></div>';

  if(den.length){
    h += '<div class="kpi bad"><div class="kl">✕ 权限不足</div><div class="kd">' + den.length +
         ' 个条件因当前角色权限被剔除，规模不可信。切回「产运」或就地申请。</div></div>';
  }
  if(pend.length){
    h += '<div class="kpi warn"><div class="kl">⚠ 待确认</div><div class="kd">' + pend.length +
         ' 个开放集条件未确认语义映射，尚未计入规模。</div></div>';
  }
  if(crossDomain()){
    h += '<div class="kpi warn"><div class="kl">⚠ 跨域可信度</div><div class="kd">' +
         '含跨域条件，基于账号层打通（约 85%）。<b>实际可触达可能低估 ~15%</b>，' +
         '且未打通用户偏向低活跃 / 单端。</div></div>';
  }

  h += '<div><div class="sect">画像 TGI · vs 大盘</div><div class="bars">';
  DIMS.forEach(function(d){
    var v = t[d], w = Math.max(4, Math.min(100, v/2.8));
    h += '<div class="barrow"><span>' + d + '</span><span class="bwrap"><i class="bfill" style="width:' +
         w + '%"></i></span><span class="bn">' + v + '</span></div>';
  });
  h += '</div></div>';

  if(r.reach > 0){
    h += '<div class="kpi"><div class="kl">与已有人群重合</div><div class="kd">' +
         '与「Q3 高潜召回包」重合 <b>' + overlapPct('a') + '%</b><br>' +
         '与「生服沉默唤醒包」重合 ' + overlapPct('b') + '%</div></div>';
  }

  var blocked = pend.length>0 || den.length>0 || r.reach===0;
  h += '<button class="bigbtn" id="next"' + (blocked?' disabled':'') + '>下一步 · 确认圈选逻辑</button>';
  if(pend.length) h += '<div class="blockmsg">⚠ 有未确认的开放集条件，无法进入下一步</div>';
  else if(den.length) h += '<div class="blockmsg">✕ 有无权限的条件，无法进入下一步</div>';
  else if(r.reach===0) h += '<div class="blockmsg">请先添加至少一个条件</div>';
  h += '<button class="ghostbtn" id="draft">存为草稿</button>';

  elPrev.innerHTML = h;
  lastReach = r.reach;
}

function doConfirmAct(key){
  var p = key.split('|'), act = p[0];
  var a = AUDS.filter(function(x){ return x.id===p[1]; })[0];
  closeModal();
  if(act === 'fix'){
    var iss = a.issues[+p[2]];
    a.issues.splice(+p[2], 1);
    if(iss.t === '口径漂移' || iss.t === '引用标签已下线'){
      a.ver += 1;
      a.versions.unshift({ v:a.ver, date:today(), by:'我', note:'处置「' + iss.t + '」后更新规则', reach:a.reach });
      a.updated = '2026-' + today();
    }
    if(iss.t === '权限即将到期') a.expire = 90;
    toast('已处置「<b>' + iss.t + '</b>」。健康度已更新。');
    renderAssets(); return;
  }
  if(act === 'roll'){
    var v = a.versions.filter(function(x){ return x.v === +p[2]; })[0];
    a.ver += 1; a.reach = v.reach;
    a.versions.unshift({ v:a.ver, date:today(), by:'我', note:'回滚至 v' + v.v, reach:v.reach });
    a.updated = '2026-' + today();
    toast('已回滚，产生 <b>v' + a.ver + '</b>。历史版本全部保留，' + a.refs.length + ' 处引用方已收到通知。');
    renderAssets(); return;
  }
  if(act === 'editrule'){
    switchView('build');
    say('a', '已载入规则 <b>' + esc(a.name) + '</b>（v' + a.ver + '）的条件到画布。' +
      '改完重新走确认关，保存后会产生 <b>v' + (a.ver+1) + '</b>。' +
      '<br><br>（demo 里未真实回填条件，真实产品中这里会把 IR 反序列化到画布上。）');
    return;
  }
  if(act === 'tpl'){ toast('已存入团队模板库：<b>' + esc(a.name) + ' · 模板</b>。其他人可 fork，fork 出的规则保留血缘。'); return; }
  if(act === 'iter'){
    a.ver += 1;
    a.reach = Math.round(a.reach * 0.72);
    a.versions.unshift({ v:a.ver, date:today(), by:'我', note:'基于回流效果迭代：排除已转化用户', reach:a.reach });
    a.updated = '2026-' + today();
    toast('已生成 <b>v' + a.ver + '</b>，排除本轮已转化用户后规模 ' + fmt(a.reach) + '。可与 v' + (a.ver-1) + ' 直接对比效果。');
    renderAssets(); return;
  }
  if(act === 'hand'){ a.owner = '林'; toast('已转交。<b>Owner 变更会同步到治理平台的授权记录</b>。'); renderAssets(); return; }
  if(act === 'off'){
    AUDS = AUDS.filter(function(x){ return x.id !== a.id; });
    SEL = AUDS.length ? AUDS[0].id : null;
    toast('已下线，进入<b>冻结</b>状态 30 天，期间可恢复。');
    renderAssets(); return;
  }
}

/* ============ 弹窗 ============ */
var mask = document.getElementById('mask');
function openModal(title, sub, body, foot){
  document.getElementById('mtitle').textContent = title;
  document.getElementById('msub').textContent = sub || '';
  document.getElementById('mbody').innerHTML = body;
  document.getElementById('mfoot').innerHTML = foot;
  mask.hidden = false;
}
function closeModal(){ mask.hidden = true; editTarget = null; }
mask.addEventListener('click', function(e){ if(e.target === mask) closeModal(); });
document.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeModal(); });

/* ---- 加条件：标签（分类树）/ 行为事件 ---- */
var pickTab = 'tag', pickTarget = null, pickState = {};

function allTags(){
  var out = [];
  ENUMS.forEach(function(t){ out.push({ k:'enum', t:t }); });
  INTERESTS.forEach(function(t){ out.push({ k:'interest', t:t }); });
  return out;
}
function taxonomy(){
  var tree = [], idx = {};
  allTags().forEach(function(x){
    var a = x.t.cat[0], b = x.t.cat[1];
    if(!idx[a]){ idx[a] = { name:a, n:0, subs:[], sidx:{} }; tree.push(idx[a]); }
    var A = idx[a];
    if(!A.sidx[b]){ A.sidx[b] = { name:b, n:0 }; A.subs.push(A.sidx[b]); }
    A.n++; A.sidx[b].n++;
  });
  return tree;
}
var editTarget = null; // 正在编辑的条件 id，null = 新增模式

function openPicker(target){
  pickTarget = target; pickTab = 'tag'; editTarget = null;
  pickState = { c1:null, c2:null, q:'', sel:null, enumVals:[], ints:[],
                ev:'ecom.impression', w:30, t:3, mod:'none', neg:'0' };
  renderPicker();
}
function openEditCond(c){
  editTarget = c.id;
  if(c.type === 'behavior'){
    pickTab = 'behavior';
    pickState = { c1:null,c2:null,q:'',sel:null,enumVals:[],ints:[],
      ev:c.ev, w:c.w, t:c.t, mod:c.mod, neg: c.neg ? '1' : '0' };
  } else {
    var tg = ENUMS.filter(function(x){ return x.id === c.src; })[0];
    pickTab = 'tag';
    pickState = { c1: tg ? tg.cat[0] : null, c2: tg ? tg.cat[1] : null, q:'',
      sel: c.src, enumVals: (c.vals||[]).slice(), ints:[],
      ev:'ecom.impression', w:30, t:3, mod:'none', neg:'0' };
  }
  renderPicker();
}
function pickedTag(){
  if(!pickState.sel) return null;
  var r = allTags().filter(function(x){ return x.t.id === pickState.sel; })[0];
  return r || null;
}

function renderPicker(){
  var b = '<div class="tabs">' +
    [['tag','标签 · 属性与兴趣'],['behavior','行为事件']].map(function(k){
      return '<button class="tab' + (pickTab===k[0]?' on':'') + '" data-tab="' + k[0] + '">' + k[1] + '</button>';
    }).join('') + '</div>';

  if(pickTab === 'behavior'){ b += behaviorPane(); }
  else if(pickState.sel){    b += valuePane(); }
  else {                     b += browsePane(); }

  var cur = pickedTag();
  var can = pickTab === 'behavior' ||
            (cur && cur.k === 'enum' && pickState.enumVals.length) ||
            (cur && cur.k === 'interest' && pickState.ints.length);
  var note = editTarget ? '改完保存，条件 ID 与血缘信息保持不变'
           : (pickTab === 'behavior' ? '时间窗与阈值为系统默认值，加入后会标黄待核对'
           : (cur && cur.k === 'interest' ? '你自己从分类里选的标签，无需再确认语义映射' : ''));
  var foot = '<span class="fnote">' + note + '</span>' +
    '<button class="btn sec" data-close="1">取消</button>' +
    '<button class="btn pri" id="pickok"' + (can?'':' disabled') + '>' +
      (editTarget ? '保存修改' : '加入画布') + '</button>';
  openModal(editTarget ? '编辑条件取值' : '添加条件',
    editTarget ? '改完立即重算规模，不用重新过一遍问句' : (pickTarget==='EX' ? '加入排除区' : '加入条件组'),
    b, foot);
}

/* 浏览态：左树 + 右列表 */
function browsePane(){
  var tree = taxonomy(), q = pickState.q.trim();
  var h = '<div class="pk"><div class="pktree">';
  h += '<button class="tnode l1' + (!pickState.c1?' on':'') + '" data-c1="">' +
       '<span>全部</span><span class="tc">' + allTags().length + '</span></button>';
  tree.forEach(function(A){
    h += '<button class="tnode l1' + (pickState.c1===A.name && !pickState.c2 ?' on':'') +
         '" data-c1="' + esc(A.name) + '"><span>' + A.name + '</span><span class="tc">' + A.n + '</span></button>';
    if(pickState.c1 === A.name){
      A.subs.forEach(function(B){
        h += '<button class="tnode l2' + (pickState.c2===B.name?' on':'') +
             '" data-c1="' + esc(A.name) + '" data-c2="' + esc(B.name) + '">' +
             '<span>' + B.name + '</span><span class="tc">' + B.n + '</span></button>';
      });
    }
  });
  h += '</div><div class="pkmain">';
  h += '<input class="srch" id="tsrch" placeholder="搜索标签名或含义…" value="' + esc(pickState.q) + '">';

  var list = allTags().filter(function(x){
    if(pickState.c1 && x.t.cat[0] !== pickState.c1) return false;
    if(pickState.c2 && x.t.cat[1] !== pickState.c2) return false;
    if(!q) return true;
    var t = x.t;
    if(t.name.indexOf(q)>-1 || (t.desc||'').indexOf(q)>-1 || t.id.indexOf(q)>-1) return true;
    if((t.kw||[]).some(function(k){ return k.indexOf(q)>-1 || q.indexOf(k)>-1; })) return true;
    // 值级检索：资产里没有叫「露营」的标签，用户搜的是字段里的取值
    return (t.vals||[]).some(function(v){ return v.indexOf(q)>-1 || q.indexOf(v)>-1; });
  });

  if(q){
    h += '<div class="tabnote" style="margin-bottom:.2rem"><b>值级检索：</b>' +
      '资产里并没有叫「' + esc(q) + '」的标签——兴趣类字段是<b>数组存储</b>，' +
      '你搜的是<b>字段里的取值</b>。命中结果展示为「字段 ＋ 具体取值」。</div>';
  }
  h += '<div class="crumb">' +
       (pickState.c1 ? '<b>' + esc(pickState.c1) + '</b>' : '全部分类') +
       (pickState.c2 ? ' › <b>' + esc(pickState.c2) + '</b>' : '') +
       ' · 共 ' + list.length + ' 个标签</div>';

  if(!list.length){
    h += '<div class="warnbox"><div class="wl">检索无结果</div>' +
      '当前资产库里没有匹配「' + esc(q) + '」的标签。<b>可一键提资产需求</b>，' +
      '回流给标签供给方——这也是治理流程里"驱动标签迭代"的入口。</div>';
  } else {
    h += '<div class="optlist">' + list.map(function(x){
      var t = x.t, lock = !canSee(t.lv);
      var meta = x.k === 'enum'
        ? [t.id, t.vals.length + ' 个取值']
        : [t.field ? '字段 ' + t.field : t.src, t.freq].concat(t.acc?[t.acc]:[]);
      var hit = (x.k === 'interest' && q && t.vals)
        ? t.vals.filter(function(v){ return v.indexOf(q)>-1 || q.indexOf(v)>-1; }) : [];
      return '<button class="opt' + (lock?' locked':'') + '" data-ptag="' + t.id + '"' + (lock?' disabled':'') + '>' +
        '<div class="ob"><div class="on1"><span class="onm">' + t.name + '</span>' +
        '<span class="ctype ' + x.k + '">' + (x.k==='enum'?'枚举':'兴趣') + '</span>' +
        '<span class="clv' + (lvNum(t.lv)>=3?' hi':'') + '">' + t.lv + '</span>' +
        (lock?'<span class="clv hi">需申请</span>':'') + '</div>' +
        '<div class="od">' + t.desc + '</div>' +
        (hit.length ? '<div class="od" style="color:var(--agent);font-weight:600">↳ 命中取值：' +
           hit.map(function(v){ return '「' + esc(v) + '」'; }).join(' ') + '</div>' : '') +
        '<div class="om">' + meta.map(function(m){ return '<span>' + m + '</span>'; }).join('') + '</div></div>' +
        (x.k==='interest' ? '<span class="cnt">' + fmt(t.reach) + '</span>' : '') +
        '</button>';
    }).join('') + '</div>';
  }
  h += '</div></div>';
  return h;
}

/* 取值态：根据标签类型自动切换 */
function valuePane(){
  var cur = pickedTag(), t = cur.t;
  var h = '<div class="crumb"><button class="mini" data-pback="1">← 返回列表</button>' +
          esc(t.cat[0]) + ' › ' + esc(t.cat[1]) + ' › <b>' + esc(t.name) + '</b></div>';
  h += '<div class="tabnote">' + t.desc +
       (t.caveat ? '<br><b style="color:var(--gov)">⚠ ' + t.caveat + '</b>' : '') + '</div>';

  if(cur.k === 'enum'){
    var mx = Math.max.apply(null, t.vals.map(function(v){ return v[1]; }));
    h += '<div class="sect">选择取值 · 组内为 OR</div>';
    h += '<div class="optlist">' + t.vals.map(function(v){
      var on = pickState.enumVals.indexOf(v[0]) > -1;
      return '<button class="opt' + (on?' on':'') + '" data-eval="' + esc(v[0]) + '">' +
        '<span class="ck">' + (on?'✓':'') + '</span><div class="ob">' +
        '<div class="onm">' + esc(v[0]) + '</div>' +
        '<div class="valbar"><i style="width:' + Math.max(2,(v[1]/mx*100)) + '%"></i></div></div>' +
        '<span class="cnt">' + fmt(v[1]) + '</span></button>';
    }).join('') + '</div>';
    if(pickState.enumVals.length){
      var sum = 0;
      t.vals.forEach(function(v){ if(pickState.enumVals.indexOf(v[0])>-1) sum += v[1]; });
      h += '<div class="warnbox"><div class="wl">已选</div>' + pickState.enumVals.join('、') +
           ' → 合计约 <b>' + fmt(sum) + '</b>（取值互斥，可直接相加）</div>';
    }
  } else {
    var sibs = INTERESTS.filter(function(x){ return x.cat[1] === t.cat[1]; });
    h += '<div class="sect">该标签已选 · 可一并选入相近标签（组内为 OR）</div>';
    h += '<div class="optlist">' + sibs.map(function(x){
      var on = pickState.ints.indexOf(x.id) > -1, lock = !canSee(x.lv);
      return '<button class="opt' + (on?' on':'') + (lock?' locked':'') + '" data-itag="' + x.id + '"' + (lock?' disabled':'') + '>' +
        '<span class="ck">' + (on?'✓':'') + '</span><div class="ob">' +
        '<div class="on1"><span class="onm">' + x.name + '</span>' +
        '<span class="clv' + (lvNum(x.lv)>=3?' hi':'') + '">' + x.lv + '</span>' +
        (lock?'<span class="clv hi">需申请</span>':'') + '</div>' +
        '<div class="od">' + x.desc + '</div>' +
        '<div class="om"><span>' + x.src + '</span><span>' + x.freq + '</span>' +
        (x.acc?'<span>' + x.acc + '</span>':'') + '</div></div>' +
        '<span class="cnt">' + fmt(x.reach) + '</span></button>';
    }).join('') + '</div>';
    if(pickState.ints.length > 1){
      h += '<div class="warnbox"><div class="wl">多选提示</div>已选 ' + pickState.ints.length +
           ' 个标签，组内为 <b>OR</b>。两两重合度约 <b>' + (18 + pickState.ints.length*9) +
           '%</b>，合并后规模并非简单相加。</div>';
    }
    h += '<div class="tabnote"><b>注意：</b>你是自己从分类里挑的标签，语义没有歧义，' +
         '<b>加入后直接生效，不需要过确认关</b>。确认关只针对 Agent 从自然语言替你推断出来的映射。</div>';
  }
  return h;
}

function buildConds(R, keys, roleLabel){
  var out = { conds:[], excludes:[], texts:[] };
  keys.forEach(function(k){
    var r = R[k]; if(!r || !r.tag) return;
    var tg = ENUMS.filter(function(x){ return x.id === r.tag; })[0]; if(!tg) return;
    var c = mkEnum(tg, r.vals.filter(function(v){
      return tg.vals.some(function(tv){ return tv[0] === v; }); }));
    if(!c.reach) return;
    c.roleTag = (k==='same') ? 'qualify' : k;
    out.conds.push(c); out.texts.push(c.text);
  });
  var ex = R.exclude && R.exclude.behavior;
  if(ex){
    var bc = mkBehavior(ex.ev, ex.w, ex.t, ex.mod, false);
    bc.roleTag = 'exclude';
    out.excludes.push(bc); out.texts.push('排除：' + bc.text);
  }
  return out;
}

        cond = mkEnum(tg, c.vals.filter(function(v){

        if(!cond.reach){ cond.reach = c.reach; cond.text = c.label; }
      } else {
        cond = { id:nid(), type:'enum', src:c.tag, name:c.label, ns:'cross', lv:c.lv,
                 text:c.label, reach:c.reach, confirmed:true, note:'' };
      }
      cond.note = c.warn ? c.warn.replace(/<[^>]+>/g,'') : '';
      cond.mapFrom = term;
      S.groups[0].conds.push(cond);
      added.push(c.label);
    });
  });
  closeModal();
  say('a', '已按你的选择生成条件：<b>' + added.join('、') + '</b>。<br><br>' +
    '<b>注意这一步和 NL-to-SQL 的区别</b>：它会直接替你选一个然后生成 SQL；' +
    '这里是你自己在看过口径、分母、覆盖规模和历史证据之后做的决定——<b>选错的责任和依据都是可追溯的</b>。');
  render();
}

    var neg = document.getElementById('bneg');
    c = mkBehavior(pickState.ev, pickState.w, pickState.t, pickState.mod, neg && neg.value==='1');
    if(!editTarget) c.note = '时间窗与阈值为系统默认值，请核对';
  } else {
    var cur = pickedTag();
    if(!cur) return;
    if(cur.k === 'enum'){
      c = mkEnum(cur.t, pickState.enumVals);
    } else {
      // 用户自己从分类树里挑的，语义无歧义 —— 直接生效，不过确认关
      c = mkInterest(pickState.ints, pickState.ints);
      c.confirmed = true;
    }
  }
  if(editTarget){
    var old = allConds().filter(function(x){ return x.id===editTarget; })[0];
    c.id = editTarget;
    if(old && old.mapFrom) c.mapFrom = old.mapFrom;
    replaceCond(editTarget, c);
    closeModal();
    toast('已更新「<b>' + esc(c.text) + '</b>」，规模已重算为 <b>' + fmt(c.reach) + '</b>。');
    render();
    return;
  }
  if(pickTarget === 'EX') S.excludes.push(c);
  else {
    var g = S.groups.filter(function(x){ return x.id===pickTarget; })[0] || S.groups[0];
    g.conds.push(c);
  }
  closeModal();
  if(pickTab === 'tag'){
    var k = pickedTag();
    if(k && k.k === 'interest'){
      say('a', '已加入兴趣条件「<b>' + esc(c.text) + '</b>」，<b>直接生效</b>。' +
        '你是自己从分类里挑的，语义没有歧义——<b>确认关只针对我从自然语言替你推断出来的映射</b>。');
    }
  }
  render();
}

function handleQuery(){
  var el = document.getElementById('qin');
  var q = el.value.trim();
  if(!q) return;
  el.value = '';
  say('u', esc(q));
  say('a', '<span class="thinking">正在拆解条件…</span>');
  setTimeout(function(){
    S.msgs.pop();

    // 优先：识别业务词 → 走语义映射面板，不替用户决定
    var bt = matchBizTerm(q);
    if(bt.length){
      say('a', '识别到 <b>' + bt.length + ' 个业务词</b>：' +
        bt.map(function(x){ return '「' + esc(x) + '」'; }).join('、') +
        '。<br><br>这些词在资产库里<b>各自对应多个候选标签</b>，口径与分母不同。' +
        '<b>我不替你选</b>——把每个候选的口径、分母、覆盖规模、权限和历史证据摆出来，你来定。');
      setTimeout(function(){ openMapping(bt); }, 260);
      return;
    }

    var hits = [], reply = [];

    ENUMS.forEach(function(t){
      if(q.indexOf('一二线')>-1 && t.id==='trade.common.city_tier'){
        S.groups[0].conds.push(mkEnum(t, ['一线','新一线'])); hits.push('城市等级');
      } else if((q.indexOf('高消费')>-1||q.indexOf('高潜')>-1) && t.id==='trade.local.consume_level'){
        S.groups[0].conds.push(mkEnum(t, ['4','5'])); hits.push('生服消费等级');
      } else if(q.indexOf('低消费')>-1 && t.id==='trade.ecom.consume_level'){
        S.groups[0].conds.push(mkEnum(t, ['L1','L2'])); hits.push('电商消费等级');
      }
    });

    var im = INTERESTS.filter(function(t){
      return t.kw.some(function(k){ return q.indexOf(k)>-1; }); });
    if(im.length){
      var c = mkInterest(im.map(function(x){ return x.id; }), []);
      c.text = im.map(function(x){ return x.name; }).join(' 或 ');
      c.confirmed = false;
      S.groups[0].conds.push(c);
      reply.push('检索到 <b>' + im.length + ' 个语义相近的兴趣标签</b>（' +
        im.map(function(x){ return x.name + ' ' + fmt(x.reach); }).join('、') +
        '）。<b>规模差异明显，我不替你决定</b>，请在条件卡上确认映射。');
    }

    var em = EVENTS.filter(function(e){ return e.kw.some(function(k){ return q.indexOf(k)>-1; }); });
    if(em.length){
      var neg = q.indexOf('没')>-1 || q.indexOf('未')>-1 || q.indexOf('无')>-1;
      var mod = (q.indexOf('没下单')>-1||q.indexOf('未下单')>-1||q.indexOf('没买')>-1) ? 'no_order' : 'none';
      var ev = em[0];
      if(mod !== 'none' && ev.id === 'ecom.order' && em.length > 1) ev = em[1];
      var bc = mkBehavior(ev.id, 30, mod!=='none'?3:1, mod, neg && ev.id==='ecom.order' && mod==='none');
      bc.note = '时间窗与阈值为系统默认值，请核对';
      if(neg && mod==='none') S.excludes.push(bc); else S.groups[0].conds.push(bc);
      reply.push('行为条件已按<b>三要素</b>拆解：' + esc(bc.text) +
        '。时间窗与阈值我给了默认值，<b>已标黄</b>。');
    }

    if(hits.length) reply.unshift('识别到枚举属性：<b>' + hits.join('、') +
      '</b>，取值域封闭、语义无歧义，<b>已直接落盘</b>。');
    if(!reply.length) reply.push('没能从这句话里拆出可执行的条件。<b>我不猜</b>——' +
      '你说的是哪一类？枚举属性（消费等级 / 城市）、兴趣标签（露营 / 火锅），还是行为（曝光 / 下单）？');
    say('a', reply.join('<br><br>'));
    render();
  }, 480);
}

function boot(){
  S.msgs = [{ who:'a', html:'我是圈人助手。你可以直接说一句话，也可以在中栏手动点选条件——' +
    '<b>两条路等价，随时切换</b>。<br><br>先试试下面的示例问句，按顺序点更能看出设计意图。' }];
  renderChat(); renderChips(); render(); renderAssets();
  document.getElementById('role').value = S.role;
}
boot();

})();
</script>
